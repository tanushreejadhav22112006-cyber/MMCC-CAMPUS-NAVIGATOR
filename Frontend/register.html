<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMCC Campus Navigator - Register</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        // Check if already logged in
        const token = localStorage.getItem('access_token');

        if (token) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-map-location-dot"></i>
                <span>MMCC Campus Navigator</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="login.html" class="nav-link">Login</a></li>
                <li><a href="register.html" class="nav-link register-btn active">Register</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Join MMCC</h1>
                    <p>Create your MMCC Campus Navigator account</p>
                </div>

                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        </div>
                        <span class="error-message" id="nameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('password')"></i>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                            <p class="strength-text">Password strength: <span id="strengthText">Weak</span></p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('confirm-password')"></i>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>

                    <div class="form-group">
                        <label for="userType">Select Your Role</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user-tag"></i>
                            <select id="userType" name="userType" required>
                                <option value="student">Student</option>
                                <option value="faculty">Faculty</option>
                                <option value="visitor">Visitor</option>
                            </select>
                        </div>
                        <span class="error-message" id="userTypeError"></span>
                    </div>

                    <div class="form-group">
                        <label class="checkbox">
                            <input type="checkbox" name="terms" required>
                            <span>I agree to the <a href="#" class="link">Terms and Conditions</a></span>
                        </label>
                        <span class="error-message" id="termsError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="auth-alternatives">
                    <button class="btn btn-social">
                        <i class="fab fa-google"></i>
                        Sign up with Google
                    </button>
                </div>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
                </div>
            </div>

            <div class="auth-illustration">
                <div class="illustration-content">
                    <i class="fas fa-user-check"></i>
                    <h3>Easy Sign Up</h3>
                    <p>Join our community in just a few steps</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2024 Campus Navigator. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
    <script>
        const API_BASE_URL = 'http://127.0.0.1:5001/api';

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            clearErrors();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const userType = document.getElementById('userType').value;
            const termsAccepted = e.target.querySelector('input[name="terms"]').checked;
            
            // Validate inputs
            let hasError = false;
            
            if (name.length < 3) {
                showError('nameError', 'Name must be at least 3 characters');
                hasError = true;
            }
            
            if (!email || !isValidEmail(email)) {
                showError('emailError', 'Please enter a valid email address');
                hasError = true;
            }
            
            if (password.length < 6) {
                showError('passwordError', 'Password must be at least 6 characters');
                hasError = true;
            }
            
            if (password !== confirmPassword) {
                showError('confirmPasswordError', 'Passwords do not match');
                hasError = true;
            }
            
            if (!userType) {
                showError('userTypeError', 'Please select your role');
                hasError = true;
            }
            
            if (!termsAccepted) {
                showError('termsError', 'You must accept the terms and conditions');
                hasError = true;
            }
            
            if (hasError) return;
            
            const registerBtn = e.target.querySelector('button[type="submit"]');
            const originalText = registerBtn.innerHTML;
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            
            fetch(`${API_BASE_URL}/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    user_type: userType
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showError('emailError', data.error);
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = originalText;
                    return;
                }
                
                // Store user data
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_id', data.user.id);
                localStorage.setItem('user_name', data.user.name);
                localStorage.setItem('user_email', data.user.email);
                localStorage.setItem('user_type', data.user.user_type);

                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            })
            .catch(error => {
                console.error('Registration error:', error);
                showError('emailError', 'Unable to connect to server. Please try again.');
                registerBtn.disabled = false;
                registerBtn.innerHTML = originalText;
            });
        });
        
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }
        
        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(el => {
                el.textContent = '';
                el.style.display = 'none';
            });
        }
        
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        
        // Update select styling on change
        document.getElementById('userType').addEventListener('change', function() {
            this.classList.add('selected');
        });
    </script>
    
    <style>
        .input-wrapper select {
            width: 100%;
            padding: 0.75rem 1rem;
            padding-left: 2.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        
        .input-wrapper select:focus {
            outline: none;
            border-color: #6366F1;
        }
        
        .input-wrapper select.selected {
            border-color: #10B981;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i.fa-user-tag {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748B;
            pointer-events: none;
        }
    </style>
</body>
</html>
